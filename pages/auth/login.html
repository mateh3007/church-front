<!-- Tela de Login -->
<div id="login-screen" class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <i class="fas fa-church"></i>
            </div>
            <h1>Church Manager</h1>
            <p>Faça login para continuar</p>
        </div>
        
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="login-password">Senha</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('login-password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Entrar</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Primeira vez aqui?</p>
            <button type="button" class="btn btn-link" onclick="showScreen('onboarding-screen')">
                Criar nova organização
            </button>
        </div>
    </div>
</div>
